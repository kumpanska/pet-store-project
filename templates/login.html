{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід у систему — Зоомагазин</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>🐾 Вхід у систему</h2>
        <p class="subtitle">Інформаційна система обліку зоомагазину</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Логін співробітника</label>
                <input type="text" name="login" class="form-control" placeholder="Введіть логін" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Увійти</button>
        </form>

        <p style="margin-top: 16px; font-size: 13px; text-align: center; color: #575C55;">
            Немає облікового запису? <a href="{% url 'register' %}" style="color: #86612F; font-weight: 600;">Зареєструватися</a>
        </p>

        <hr style="margin: 18px 0; border: none; border-top: 1px solid #e2e8f0;">

        <a href="{% url 'shop_catalog' %}" class="btn btn-secondary btn-block">
            🛍️ Перейти в інтернет-магазин для клієнтів →
        </a>
    </div>
</div>
</body>
</html>
