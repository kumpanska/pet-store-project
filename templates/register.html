{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація співробітника — Зоомагазин</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
        <h2>Реєстрація в системі</h2>
        <p class="subtitle">Створення облікового запису працівника</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>ПІБ співробітника</label>
                <input type="text" name="full_name" class="form-control" placeholder="Петренко Іван Іванович" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Посада</label>
                    <input type="text" name="position" class="form-control" placeholder="Продавець-консультант" required>
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="text" name="phone" class="form-control" placeholder="+380..." required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Роль у системі</label>
                    <select name="role_id" class="form-control" required>
                        {% for role in roles %}
                            <option value="{{ role.id }}">{{ role.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Торгова точка / Склад</label>
                    <select name="store_id" class="form-control">
                        <option value="">-- Вся мережа --</option>
                        {% for st in stores %}
                            <option value="{{ st.id }}">{{ st.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Логін</label>
                    <input type="text" name="login" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Створити акаунт</button>
        </form>

        <p style="margin-top: 16px; font-size: 13px; text-align: center; color: #575C55;">
            Вже є акаунт? <a href="{% url 'login' %}" style="color: #86612F; font-weight: 600;">Увійти</a>
        </p>
    </div>
</div>
</body>
</html>
