{% extends 'shop/base_shop.html' %}
{% block title %}Вхід для покупців{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 32px auto;">
    <h2>Вхід в особистий кабінет</h2>
    <p style="color: #575C55; font-size: 0.9em;">Увійдіть, щоб автоматично застосовувати вашу персональну знижку та відстежувати замовлення.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Номер телефону</label>
            <input type="text" name="phone" class="form-control" placeholder="+380..." required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Увійти</button>
    </form>

    <p style="margin-top: 16px; text-align: center; font-size: 0.9em;">
        Ще не маєте акаунту? <a href="{% url 'shop_register' %}">Зареєструватися</a>
    </p>
</div>
{% endblock %}
